name: recordexpungPDX tests

on: [pull_request]

jobs:
  frontend:
    runs-on: ubuntu-latest
    container:
      image: node:20-alpine
      env:
        CI: true
    steps:
      - uses: actions/checkout@v4
      - name: run frontend tests
        run: cd src/frontend && npm i && npm run-script ci-test

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The tests run inside the expungeservice image so they see the pinned Python and
      # locked dependencies. The checkout happens on the host because the image is alpine
      # 3.13, whose musl cannot load the Node binary that JavaScript actions need.
      # src/shared holds fixtures both test suites read.
      - name: run backend tests
        run: |
          docker run --rm \
            -v "$PWD/src/backend:/src/backend" \
            -v "$PWD/src/shared:/src/shared" \
            -w /src/backend \
            recordsponge/expungeservice:dev \
            sh -c "pipenv run mypy && pipenv run pytest --cov=expungeservice"
